<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Shadow Line — a top-down stealth game</title>
<link rel="icon" href="data:,">
<style>
  html, body { margin: 0; padding: 0; height: 100%; overflow: hidden; background: #0a0d14; }
  #wrap { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; }
  #game { display: block; background: #11151f; touch-action: none; box-shadow: 0 0 60px rgba(0,0,0,.8); }
  #status { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
</style>
</head>
<body>
<div id="wrap"><canvas id="game" width="960" height="704" aria-label="Shadow Line: sneak past the guards, stay out of their vision cones, and reach the glowing exit"></canvas></div>
<p id="status" role="status" aria-live="polite"></p>
<script type="module" src="./src/main.js"></script>
</body>
</html>
